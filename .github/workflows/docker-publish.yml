name: Build and Push Docker Images

# Runs only after the CI workflow finishes, so a red main never publishes `latest`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  # Needed to download the change-set artifact from the CI run that triggered us.
  actions: read

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  changes:
    # PR runs are skipped: the same commits get a push run on their branch.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      root: ${{ steps.filter.outputs.root }}
      version: ${{ steps.version.outputs.version }}
      is_new: ${{ steps.version.outputs.is_new }}
      is_main: ${{ steps.branch.outputs.is_main }}
      branch_name: ${{ steps.branch.outputs.name }}
      sha: ${{ steps.branch.outputs.sha }}
    steps:
      - name: Resolve branch
        id: branch
        # Through env, never inline: a branch name is attacker-controllable shell text.
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "is_main=$([ "$BRANCH" = "main" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.branch.outputs.sha }}
          fetch-depth: 0
      # The CI run computed the change set over the whole pushed range; reuse it.
      # Anything without an artifact (workflow_dispatch, or an older CI run) builds everything.
      - uses: actions/download-artifact@v7
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        with:
          name: changed-paths
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Detect changed paths
        id: filter
        run: |
          if [ -f changed-paths.json ]; then
            for key in backend frontend root; do
              echo "$key=$(jq -r ".$key" changed-paths.json)" >> "$GITHUB_OUTPUT"
            done
          else
            echo "No change set from CI, building every image"
            printf 'backend=true\nfrontend=true\nroot=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve version
        id: version
        run: |
          base=$(jq -r '.version' config.json)
          git fetch --tags --force --quiet 2>/dev/null || true
          head_tag=$(git tag --points-at HEAD | grep -E "^v${base//./\\.}\.[0-9]+$" | sort -V | tail -n1 || true)
          if [ -n "$head_tag" ]; then
            version="${head_tag#v}"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            max=$(git tag -l "v${base}.*" | sed -E "s|^v${base}\.||" | grep -E '^[0-9]+$' | sort -n | tail -n1)
            version="${base}.$(( ${max:--1} + 1 ))"
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

  # Main image (fullstack) - Only on main branch
  build-main:
    needs: changes
    if: needs.changes.outputs.is_main == 'true' && (needs.changes.outputs.root == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/minepanel
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.changes.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ needs.changes.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Standalone backend - Production (main branch only)
  build-backend:
    needs: changes
    if: needs.changes.outputs.is_main == 'true' && (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/minepanel-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.changes.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.changes.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Standalone frontend - Production (main branch only)
  build-frontend:
    needs: changes
    if: needs.changes.outputs.is_main == 'true' && (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/minepanel-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.changes.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Test backend - Development (non-main branches)
  build-backend-test:
    needs: changes
    if: needs.changes.outputs.is_main != 'true' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/minepanel-backend-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Test frontend - Development (non-main branches)
  build-frontend-test:
    needs: changes
    if: needs.changes.outputs.is_main != 'true' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/minepanel-frontend-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Tag + GitHub release: one patch bump per merge to main
  release:
    needs: [changes, build-main]
    if: needs.changes.outputs.is_main == 'true' && github.event_name == 'workflow_run' && needs.changes.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create tag
        run: |
          tag="v${{ needs.changes.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.changes.outputs.version }}
          name: Minepanel v${{ needs.changes.outputs.version }}
          generate_release_notes: true
          body: |
            ## 🐳 Docker Images

            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/minepanel:${{ needs.changes.outputs.version }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/minepanel:latest
            ```

            Platforms: `linux/amd64`, `linux/arm64`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
