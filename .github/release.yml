# Configuration for auto-generated release notes
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - "skip-changelog"
      - "dependencies"
    authors:
      - "dependabot[bot]"

  categories:
    # Read by the panel: it flags an update as breaking when the release notes
    # carry this heading, so the user sees it before updating.
    - title: "⚠️ Breaking Changes"
      labels:
        - "breaking"

    # Read by the panel too: these land in the "Before you update" panel, above
    # the update button, for steps the user has to take by hand.
    - title: "🛠️ Manual Steps"
      labels:
        - "manual-steps"

    - title: "🚀 Features"
      labels:
        - "enhancement"
        - "feature"

    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "fix"

    - title: "🔒 Security"
      labels:
        - "security"

    - title: "📝 Documentation"
      labels:
        - "documentation"

    - title: "🔧 Configuration"
      labels:
        - "config"
        - "ci"

    - title: "♻️ Refactoring"
      labels:
        - "refactor"

    - title: "🧪 Tests"
      labels:
        - "tests"

    - title: "📦 Dependencies"
      labels:
        - "dependencies"
      collapse: true

    - title: "🏠 Other Changes"
      labels:
        - "*"
