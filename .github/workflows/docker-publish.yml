name: Build and Push Docker Images

# Runs only after the CI workflow finishes, so a red main never publishes `latest`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  # Needed to download the change-set artifact from the CI run that triggered us.
  actions: read

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  changes:
    # PR runs are skipped: the same commits get a push run on their branch.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.filter.outputs.root }}
      test_images: ${{ steps.filter.outputs.test_images }}
      version: ${{ steps.version.outputs.version }}
      is_new: ${{ steps.version.outputs.is_new }}
      is_main: ${{ steps.branch.outputs.is_main }}
      branch_name: ${{ steps.branch.outputs.name }}
      sha: ${{ steps.branch.outputs.sha }}
    steps:
      - name: Resolve branch
        id: branch
        # Through env, never inline: a branch name is attacker-controllable shell text.
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "is_main=$([ "$BRANCH" = "main" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.branch.outputs.sha }}
          fetch-depth: 0
      # The CI run computed the change set over the whole pushed range; reuse it.
      # Anything without an artifact (workflow_dispatch, or an older CI run) builds everything.
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        with:
          name: changed-paths
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Detect changed paths
        id: filter
        run: |
          if [ -f changed-paths.json ]; then
            backend=$(jq -r '.backend' changed-paths.json)
            frontend=$(jq -r '.frontend' changed-paths.json)
            root=$(jq -r '.root' changed-paths.json)
          else
            echo "No change set from CI, building every image"
            backend=true frontend=true root=true
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          # Which test images a non-main branch needs, as the matrix that builds them.
          echo "test_images=$(jq -cn --arg b "$backend" --arg f "$frontend" \
            '[if $b == "true" then "backend" else empty end,
              if $f == "true" then "frontend" else empty end]')" >> "$GITHUB_OUTPUT"
      - name: Resolve version
        id: version
        run: |
          base=$(jq -r '.version' config.json)
          git fetch --tags --force --quiet 2>/dev/null || true
          head_tag=$(git tag --points-at HEAD | grep -E "^v${base//./\\.}\.[0-9]+$" | sort -V | tail -n1 || true)
          if [ -n "$head_tag" ]; then
            version="${head_tag#v}"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            max=$(git tag -l "v${base}.*" | sed -E "s|^v${base}\.||" | grep -E '^[0-9]+$' | sort -n | tail -n1)
            version="${base}.$(( ${max:--1} + 1 ))"
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

  # Every image is built once per architecture, each on a runner of that architecture, and
  # pushed by digest; `merge` below stitches the digests into one multi-arch tag. There is
  # no QEMU on purpose: emulating arm64 ran node under emulation, where `pnpm install` hung
  # for the whole 60m timeout and cost v1.12.12 its release.
  #
  # The three production images build together on every release: APP_VERSION is baked into
  # the backend, so a release that skipped it would leave the panel reporting the previous
  # version and offering an update that pulls nothing.
  build:
    needs: changes
    if: needs.changes.outputs.is_main == 'true' && (needs.changes.outputs.root == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [fullstack, backend, frontend]
        arch: [amd64, arm64]
        include:
          - app: fullstack
            image: minepanel
            file: Dockerfile
          - app: backend
            image: minepanel-backend
            file: backend/Dockerfile
          - app: frontend
            image: minepanel-frontend
            file: frontend/Dockerfile
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels only: the tags land on the manifest list, not on the per-arch images.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ matrix.app != 'frontend' && format('APP_VERSION={0}', needs.changes.outputs.version) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}

      # One empty file per built architecture, named after its digest.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Publishes the tags: until this runs, the per-arch images exist only as digests.
  merge:
    needs: [changes, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: fullstack
            image: minepanel
          - app: backend
            image: minepanel-backend
          - app: frontend
            image: minepanel-frontend
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.changes.outputs.version }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

  # Test images - Development (non-main branches)
  build-test:
    needs: changes
    if: needs.changes.outputs.is_main != 'true' && needs.changes.outputs.test_images != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.test_images) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/minepanel-${{ matrix.app }}-test,push-by-digest=true,name-canonical=true,push=true
          # Shared with the production build of the same Dockerfile.
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-test:
    needs: [changes, build-test]
    if: needs.changes.outputs.is_main != 'true' && needs.changes.outputs.test_images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.test_images) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/minepanel-${{ matrix.app }}-test
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

  # Docker Hub overview for the three public images, sourced from .github/dockerhub/README.md.
  # Needs DOCKERHUB_TOKEN with the "Read, Write, Delete" scope; a push-only token gets a 403.
  dockerhub-readme:
    needs: changes
    if: needs.changes.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: minepanel
            short: Self-hosted panel to run Minecraft Java & Bedrock servers with Docker · docs minepanel.ketbome.com
          - image: minepanel-backend
            short: Minepanel API (NestJS) · Minecraft Java & Bedrock server manager · docs minepanel.ketbome.com
          - image: minepanel-frontend
            short: Minepanel web UI (Next.js) · Minecraft Java & Bedrock server manager · docs minepanel.ketbome.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          readme-filepath: .github/dockerhub/README.md
          short-description: ${{ matrix.short }}

  # Tag + GitHub release: one patch bump per merge to main, and only once every image
  # for it is tagged (v1.12.10 was tagged while the backend build was still hanging).
  release:
    needs: [changes, merge]
    if: needs.changes.outputs.is_main == 'true' && github.event_name == 'workflow_run' && needs.changes.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create tag
        run: |
          tag="v${{ needs.changes.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.changes.outputs.version }}
          name: Minepanel v${{ needs.changes.outputs.version }}
          generate_release_notes: true
          body: |
            ## 🐳 Docker Images

            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/minepanel:${{ needs.changes.outputs.version }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/minepanel:latest
            ```

            Platforms: `linux/amd64`, `linux/arm64`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
